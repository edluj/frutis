name: Frontend

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  push:
    branches: [develop, main]
    tags: ['v*']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

jobs:
  pruebas:
    name: Pruebas del frontend en Python 3.12
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: frontend/requirements-dev.txt

      - name: Bibliotecas del sistema para Qt
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Revisar el código
        run: python -m pyflakes app tests

      - name: Correr pruebas
        run: python -m pytest -q

  ejecutable:
    # EC-14: Frutis.exe (Windows) y Frutis (Linux). PyInstaller construye solo para el sistema donde corre.
    name: Ejecutable para ${{ matrix.nombre }}
    needs: pruebas
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: Windows
            archivo: Frutis.exe
          - os: ubuntu-24.04
            nombre: Linux
            archivo: Frutis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: frontend/requirements-build.txt

      - name: Bibliotecas del sistema para Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Instalar dependencias
        run: pip install -r requirements-build.txt

      - name: Construir con PyInstaller
        run: pyinstaller --noconfirm --log-level WARN frutis.spec

      - name: Prueba de arranque (10 s en modo demostración, sin pantalla)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/${{ matrix.archivo }} --demo &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid" || true
            echo "::error::El ejecutable se cerró antes de 10 segundos"
            exit 1
          fi
          kill "$pid" 2>/dev/null || taskkill //F //PID "$pid" || true
          echo "El ejecutable arrancó y siguió abierto."

      - name: Preparar paquete
        run: |
          mkdir -p paquete
          cp dist/${{ matrix.archivo }} frutis.ini.example paquete/

      - uses: actions/upload-artifact@v4
        with:
          name: Frutis-${{ matrix.nombre }}
          path: frontend/paquete/
          retention-days: 30
