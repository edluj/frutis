name: Base de datos

on:
  pull_request:
    paths:
      - 'database/**'
      - '.github/workflows/database.yml'
  push:
    branches: [develop, main]
    paths:
      - 'database/**'
      - '.github/workflows/database.yml'
  workflow_dispatch:

jobs:
  mysql:
    name: Esquema y pruebas en MySQL 8.0
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v5

      - name: Instalar esquema, función, procedimiento, datos y pruebas
        env:
          MYSQL_ARGS: -h 127.0.0.1 -P 3306 -u root -proot
        run: |
          set -o pipefail
          bash database/instalar.sh --con-pruebas | tee salida.txt
          ok=$(grep -c '^OK ' salida.txt || true)
          echo "::notice title=Pruebas de base de datos::$ok pruebas pasaron en MySQL 8.0"
          {
            echo "### Pruebas de base de datos: $ok pasaron"
            echo '```'
            grep '^OK ' salida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
